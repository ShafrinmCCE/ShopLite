<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopLite</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ShopLite</h1>
<p>Small Shop Inventory and Billing System</p>

<hr>

<h2>Products</h2>

<input
        type="text"
        id="searchInput"
        placeholder="Search product..."
>

<button onclick="searchProducts()">Search</button>
<button onclick="loadProducts()">Show All</button>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Reorder Threshold</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody id="productTable">
    </tbody>
</table>



<h2>Add Product</h2>

<form id="productForm">

    <input
            type="text"
            id="productName"
            placeholder="Product Name"
            required
    >

    <input
            type="number"
            id="productPrice"
            placeholder="Price"
            step="0.01"
            required
    >

    <input
            type="number"
            id="productStock"
            placeholder="Stock Quantity"
            required
    >

    <input
            type="number"
            id="reorderThreshold"
            placeholder="Reorder Threshold"
            value="10"
            required
    >

    <button type="submit">Add Product</button>

</form>
<script src="script.js"></script>
</body>
</html>
